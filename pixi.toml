[workspace]
name = "opencode-voice"
version = "0.1.0"
description = "Flexible voice conversation CLI for OpenCode (STT/LLM/TTS providers are configurable)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
run = "python -m opencode_voice.cli"
test = "python -m pytest tests/ -q"
lint = "ruff check src/ tests/"
check = "python -m pytest tests/ -q && ruff check src/ tests/"

[dependencies]
python = ">=3.12"
httpx = ">=0.27"
numpy = ">=2.0"
python-dotenv = ">=1.0"
python-sounddevice = ">=0.4"
pyyaml = ">=6.0"

[pypi-dependencies]
pytest = ">=8.0"
ruff = ">=0.6"
opencode-voice = { path = "/home/inaho-omen/Project/opencode-voice", editable = true }
