[project]
name = "opencode-voice"
version = "0.1.0"
description = "Flexible voice conversation CLI for OpenCode (STT/LLM/TTS providers are configurable)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "sounddevice>=0.4",
  "PyYAML>=6.0",
]

[project.scripts]
opencode-voice = "opencode_voice.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_voice"]
